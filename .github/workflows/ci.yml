name: CI

on:
  push:
    branches: [main]
  pull_request:

# Circuits and contracts are tested as two independent jobs. This mirrors
# how the repo is actually built: `contracts/` only depends on the
# *committed* verification key and generated verifier (see README > The
# Groth16 pipeline), never on re-running snarkjs -- so the contracts job
# needs no ZK tooling at all, and stays fast.
jobs:
  circuits:
    name: Circuits (Circom + Groth16 pipeline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: circuits
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: circuits/package-lock.json

      - name: Install circom
        run: |
          curl -fsSL -o /usr/local/bin/circom \
            https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64
          chmod +x /usr/local/bin/circom
          circom --version

      - run: npm ci

      - name: Compile circuit
        run: npm run circuit:compile

      - name: Witness-level tests
        run: npm test

      - name: Groth16 trusted setup (toy, CI-local)
        run: npm run circuit:setup

      - name: Generate a proof
        run: npm run circuit:prove

      - name: Verify the proof
        run: npm run circuit:verify

  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-git

      - name: Check formatting
        # CreditScoreVerifier.sol is generated by snarkjs, not hand-written,
        # and is excluded from formatting checks for that reason.
        run: forge fmt --check contracts/src/ZKCreditRegistry.sol contracts/src/interfaces contracts/test

      - name: Build
        run: forge build

      - name: Test
        run: forge test -vvv
